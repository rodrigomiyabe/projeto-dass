server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular usa roteamento no navegador (history API) — qualquer rota
    # desconhecida pelo nginx deve cair de volta no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
